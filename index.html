<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A cozy fireplace in your browser: a real-time simulation of fire, with logs you can move, a poker, bellows and a match. By a brick hearth, in a hacienda, at a campfire under Mount Rainier or in a Bedouin camp in the desert, under the real night sky." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20fill='%23e8914a'%20d='M16%202c1%206-6%209-6%2017a6%206%200%200%200%2012%200c0-3-1-5-3-7%200%203-1%205-3%205%202-5%202-10%200-15z'/%3E%3C/svg%3E" />
    <title>Fireplace</title>
    <!-- Counts visits (and a few events: see src/stats.ts) with GoatCounter: no cookies. -->
    <script data-goatcounter="https://ohinai-fireplace.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <main>
      <h1 class="sr-only">Fireplace</h1>
      <!-- (Its label says which fire it is: set with the room in main.ts.) -->
      <canvas id="scene" role="img" aria-label="A wood fire burning" aria-describedby="hint"></canvas>
      <div id="loading" role="status">Lighting the fire…</div>
      <div id="panel"></div>
      <div id="corner">
        <button id="sound" class="round" title="Sound on or off (M)" aria-label="Sound" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path class="on" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4" />
            <path class="off" d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
        </button>
        <button id="view" class="round" title="Next view (V)" aria-label="Next view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10H4z" /><circle cx="12" cy="13" r="3.2" /></svg>
        </button>
        <button id="bare" class="round" title="Hide the controls: just the fire (H)" aria-label="Hide the controls">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
        </button>
        <button id="science-button" class="round" title="Science: the fire's workings, gravity, the air (X)" aria-label="Science" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3.5h5M10.5 3.5v6L5.2 18.2a1.6 1.6 0 0 0 1.4 2.3h10.8a1.6 1.6 0 0 0 1.4-2.3l-5.3-8.7v-6" /><path d="M7.6 14.5h8.8" /></svg>
        </button>
      </div>
      <div id="science" hidden></div>
      <button id="show-controls" class="round" title="Show the controls (H)" aria-label="Show the controls">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M4 12h5M13 12h7" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /><circle cx="11" cy="12" r="2" /></svg>
      </button>
      <div id="moisture" hidden>
        <div class="title">Moisture in the wood</div>
        <div class="scale"></div>
        <div class="ticks"><span>0%</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50%+</span></div>
        <div class="notes"><span>bone dry</span><span>seasoned</span><span>damp</span></div>
      </div>
      <div id="labels"></div>
      <div id="kettle-label" class="label" hidden></div>
      <div id="sky-labels"></div>
      <div id="toolbar" role="toolbar" aria-label="Tools">
        <button data-tool="tongs" title="Tongs: pick up and move logs (1)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5l6.2 11.2M17 3.5l-6.2 11.2M13.2 14.7L10 21M10.8 14.7L14 21" /><circle cx="12" cy="12.6" r="1.1" /></svg>
          <span>Tongs</span>
        </button>
        <button data-tool="poker" title="Poker: push and knock logs, stir the coals (2)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 17.5L20 4M17 7l-.5-3.5M3.5 20.5l3-3" /></svg>
          <span>Poker</span>
        </button>
        <button data-tool="blow" title="Blow on the fire (3)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h10.5a2.5 2.5 0 1 0-2.5-2.5M3 13h15a2.5 2.5 0 1 1-2.5 2.5M3 17h7" /></svg>
          <span>Blow</span>
        </button>
        <button data-tool="match" title="Match: light a firelighter or kindling (4)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20.5l9.2-9.2" /><path d="M16.8 6.2c1.6 1.2 2.4 2.6 1.9 4.1-.4 1.3-1.7 2.1-3 1.8-1.4-.3-2.2-1.7-1.7-3.1.3-1 1.1-1.9 2.8-2.8z" /></svg>
          <span>Match</span>
        </button>
      </div>
      <button id="add-log" title="Put another log on the fire (L)">Add a log</button>
      <div id="holding" role="toolbar" aria-label="Move the log you are holding" hidden>
        <button data-act="turn" data-steps="-1" title="Turn it (Q)" aria-label="Turn it left">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H4v4" /><path d="M4.5 8.5A8 8 0 1 1 6 17" /></svg>
        </button>
        <button data-act="turn" data-steps="1" title="Turn it (E)" aria-label="Turn it right">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h4v4" /><path d="M19.5 8.5A8 8 0 1 0 18 17" /></svg>
        </button>
        <button data-act="nudge" data-steps="1" title="Push it back (W, or scroll up)" aria-label="Push it back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg><span>Back</span>
        </button>
        <button data-act="nudge" data-steps="-1" title="Pull it closer (S, or scroll down)" aria-label="Pull it closer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" /></svg><span>Closer</span>
        </button>
      </div>
      <div id="hint">Drag a log to move it · Add a log with L · right-drag to look around · click anywhere for sound</div>
      <div id="message" role="alert" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
